<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Приватная шина для bluetoothd/bluealsa. На системной шине их имена держит bt-proxy,
     чтобы maind (Алиса) видел MPRIS-плееры как подключённые Bluetooth-телефоны.
     Доступ только root. -->
<busconfig>
  <type>system</type>
  <listen>unix:path=/tmp/btbus/socket</listen>
  <auth>EXTERNAL</auth>
  <policy user="root">
    <allow own="*"/>
    <allow send_destination="*" eavesdrop="true"/>
    <allow receive_sender="*"/>
    <allow eavesdrop="true"/>
  </policy>
  <policy context="default">
    <deny own="*"/>
    <deny send_destination="*"/>
  </policy>
</busconfig>
