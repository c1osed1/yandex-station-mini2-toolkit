general = {
  name = "Яндекс Станция Мини 2";
  port = 5000;

  # освободить звуковую карту у maind --mediad
  run_this_before_entering_active_state = "/etc/airplay-free.sh";

  # задержка ~0.5 c вместо штатных ~2 c
  audio_backend_latency_offset_in_seconds = -1.5;
  audio_backend_buffer_desired_length_in_seconds = 0.15;
};

alsa = {
  output_device = "plughw:0,0";
  output_rate = 44100;

  # Громкость AirPlay не применяем: играем в полную шкалу, а громкость задаёт
  # SPK Master — то есть Алиса и кнопки (их переносит volmirror). Так нет прыжков
  # в начале сессии и «громкость на индикаторе» совпадает с реальной.
  # Если хочется управлять громкостью с телефона — закомментируйте строку ниже
  # и верните mixer_control_name = "SPK Master".
  ignore_volume_control = "yes";
};
