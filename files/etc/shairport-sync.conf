general = {
  name = "Яндекс Станция Мини 2";
  port = 5000;

  # освободить звуковую карту у maind --mediad
  run_this_before_entering_active_state = "/etc/airplay-free.sh";

  # Громкость с телефона не применяем: играем в полную шкалу, а громкость задаёт
  # общий softvol (тот же, что у Алисы). ВАЖНО: опция читается из general,
  # в секции alsa она молча игнорируется.
  ignore_volume_control = "yes";

  # задержка ~0.5 c вместо штатных ~2 c
  audio_backend_latency_offset_in_seconds = -1.5;
  audio_backend_buffer_desired_length_in_seconds = 0.15;
};

alsa = {
  output_device = "default";
  output_rate = 44100;

  # Играем через тот же PCM, что и Алиса (default = softvol + dmix),
  # поэтому громкость у AirPlay и у неё одна и та же, с одинаковой кривой.
};
