general = {
  name = "Яндекс Станция Мини 2";
  port = 5000;

  # освободить звуковую карту у maind --mediad
  run_this_before_entering_active_state = "/etc/airplay-free.sh";

  # сообщить индикатору, что играем (см. /etc/statusd.sh)
  run_this_before_play_begins = "/etc/airplay-state.sh playing";
  run_this_after_play_ends = "/etc/airplay-state.sh idle";
  run_this_after_exiting_active_state = "/etc/airplay-state.sh idle";

  # задержка ~0.5 c вместо штатных ~2 c
  audio_backend_latency_offset_in_seconds = -1.5;
  audio_backend_buffer_desired_length_in_seconds = 0.15;
};

alsa = {
  output_device = "plughw:0,0";
  output_rate = 44100;
};
