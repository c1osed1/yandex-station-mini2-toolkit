# Spotify Connect для Яндекс Станции Мини 2
# Логин/пароль можно не указывать: тогда запустите один раз
#   spotifyd --authenticate   (и следуйте подсказке)
[global]
backend = "alsa"
device = "plughw:0,0"
device_name = "Яндекс Станция Мини 2"
bitrate = 320
cache_path = "/tmp/spotifyd-cache"
volume_normalisation = false
# username = "you@example.com"
# password = "secret"
