name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x -s sh scripts/*.sh build/*.sh \
            files/etc/init.d/S99dropbear files/etc/init.d/S99hostname-alisa \
            files/etc/init.d/S99shairport files/etc/init.d/S99spotifyd \
            files/etc/airplay-free.sh files/etc/profile.d/alisa-banner.sh

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: локальные ссылки в README
        run: |
          set -e
          fail=0
          grep -oE '\]\([^)]+\)' README.md | sed -E 's/^\]\(//; s/\)$//' \
            | sed -E 's/#.*$//' \
            | grep -vE '^(https?:|mailto:|$)' \
            | grep -v '^\.\./' \
            | sort -u \
            | while read -r p; do
                if [ -e "$p" ]; then echo "ok  $p"; else echo "битая ссылка: $p"; exit 1; fi
              done
