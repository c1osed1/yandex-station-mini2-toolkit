name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -s sh scripts/*.sh build/*.sh \
            files/etc/init.d/S99dropbear files/etc/init.d/S99hostname-alisa \
            files/etc/init.d/S99shairport files/etc/init.d/S99spotifyd \
            files/etc/airplay-free.sh files/etc/profile.d/alisa-banner.sh

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: проверить локальные ссылки в README
        run: |
          set -e
          grep -oE '\]\([^)]+\)' README.md | sed -E 's/^\]\(//; s/\)$//' \
            | grep -vE '^(https?:|#|mailto:)' || true
          grep -oE '\]\([^)]+\)' README.md | sed -E 's/^\]\(//; s/\)$//' \
            | grep -vE '^(https?:|#|mailto:)' \
            | while read -r p; do
                [ -e "$p" ] || { echo "битая ссылка: $p"; exit 1; }
              done
          echo "ссылки ок"
